<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Fit</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <header class="hero">
          <span class="eyebrow">AI Travel Planner</span>
          <h1>여행지와 날짜만 넣으면<br />숙소와 코스를 한 번에</h1>
          <p>Google Places 후보를 기반으로 Gemini가 예산에 맞는 동선을 정리합니다.</p>
        </header>

        <form id="tripForm" class="search-card">
          <label>
            <span>여행지</span>
            <select id="destination" required>
              <option value="Tokyo, Japan">도쿄</option>
              <option value="Osaka, Japan">오사카</option>
              <option value="Fukuoka, Japan">후쿠오카</option>
              <option value="Kyoto, Japan">교토</option>
              <option value="Sapporo, Japan">삿포로</option>
              <option value="Okinawa, Japan">오키나와</option>
              <option value="Nagoya, Japan">나고야</option>
              <option value="Yokohama, Japan">요코하마</option>
              <option value="Kobe, Japan">고베</option>
              <option value="Nara, Japan">나라</option>
              <option value="Hiroshima, Japan">히로시마</option>
              <option value="Kanazawa, Japan">가나자와</option>
            </select>
          </label>
          <div class="grid-2">
            <label>
              <span>출발일</span>
              <input id="startDate" type="date" value="2026-07-01" required />
            </label>
            <label>
              <span>도착일</span>
              <input id="endDate" type="date" value="2026-07-04" required />
            </label>
          </div>
          <div class="grid-2">
            <label>
              <span>인원</span>
              <input id="people" type="number" value="2" min="1" max="20" required />
            </label>
            <label>
              <span>예산</span>
              <input id="budget" type="number" value="1500000" min="0" step="10000" required />
            </label>
          </div>
          <button id="submitButton" type="submit">추천 코스 만들기</button>
        </form>

        <section id="status" class="status">여행 조건을 입력하고 추천 코스를 만들어보세요.</section>

        <section class="result-card">
          <div class="section-title">
            <div>
              <span>추천 플랜</span>
              <h2 id="resultTitle">아직 생성된 일정이 없습니다</h2>
            </div>
            <strong id="nightsBadge">-</strong>
          </div>
          <pre id="planText" class="plan-text">결과가 여기에 표시됩니다.</pre>
        </section>

        <section class="result-card">
          <div class="section-title">
            <div>
              <span>추천 숙소</span>
              <h2>평점 기반 후보</h2>
            </div>
          </div>
          <div id="lodgingList" class="card-list"></div>
        </section>

        <section class="result-card">
          <div class="section-title">
            <div>
              <span>관광지</span>
              <h2>지도에 표시되는 코스 후보</h2>
            </div>
          </div>
          <div id="attractionList" class="card-list"></div>
        </section>
      </section>

      <section class="map-wrap">
        <div class="map-header">
          <div>
            <span>Route Map</span>
            <h2>숙소와 관광지 경로</h2>
          </div>
          <div class="legend">
            <span><i class="hotel-dot"></i>숙소</span>
            <span><i class="place-dot"></i>관광지</span>
          </div>
        </div>
        <div id="map"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/static/app.js"></script>
  </body>
</html>
